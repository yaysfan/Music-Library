# nginx/nginx.conf

# 요청 처리량을 조절하는 worker 프로세스 설정
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # MIME 타입 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        # 80번 포트(HTTP)에서 요청을 받음
        listen 80;
        server_name localhost;

        # API 요청 처리 (백엔드로 전달)
        location /api {
            proxy_pass http://app:8080; # 'app'은 docker-compose.yml에 정의된 백엔드 서비스 이름
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 프론트엔드 요청 처리 (정적 파일 서빙)
        location / {
            root /usr/share/nginx/html; # Nginx 컨테이너 내부의 기본 웹 루트 디렉토리
            try_files $uri $uri/ /index.html; # React/Vue 같은 SPA를 위한 설정
        }
    }
}