services:
  nginx:
    image: nginx:latest
    container_name: music-library-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./dist:/usr/share/nginx/html
    depends_on:
      - app

  app:
    build: .
    container_name: music-library-app
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/music
      - SPRING_DATASOURCE_USERNAME=yaysfan
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

  db:
    image: postgres:15-alpine
    container_name: music-library-db
    restart: always
    environment:
      - POSTGRES_USER=yaysfan
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=music
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: music-library-redis
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: